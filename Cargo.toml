[package]
name = "hark"
version = "0.1.0"
edition = "2024"
description = "Local, enrolled wake-word detection over Unix domain sockets and WebSocket"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.16"
hound = "3.5"
libc = "0.2"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

tempfile = "3"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.30"
